<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人格思维矩阵 · MBTI 多人格智能体</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2333485C'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h14' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='10' r='2.5' fill='%23A9C3D9'/%3E%3Ccircle cx='19' cy='16' r='2.5' fill='%23A9C3D9'/%3E%3Ccircle cx='15' cy='22' r='2.5' fill='%23A9C3D9'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="cards.css" />
<script>
  /* set theme before first paint to avoid flash */
  (function () {
    try {
      var d = JSON.parse(localStorage.getItem('mbti_matrix_v1')) || {};
      document.documentElement.setAttribute('data-theme', d.theme || 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<style>
  #root { container-type: inline-size; display: block; min-height: 100vh; background: var(--bg); color: var(--text); transition: background .25s cubic-bezier(.2,.8,.2,1); }
  /* fonts loading guard to limit FOUT shift */
  .preload { opacity: 0; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- plain data + llm -->
<script src="data.js"></script>
<script src="llm.js"></script>

<!-- components (Babel) -->
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="store.jsx"></script>
<script type="text/babel" src="PersonaCard.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="App.jsx"></script>

<!-- mount -->
<script type="text/babel">
  const { ToastHost, App } = window;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ToastHost><App /></ToastHost>);
</script>
</body>
</html>
